syntax = "proto3";

package novitabox.v1;

import "google/protobuf/empty.proto";
import "novitabox/v1/types.proto";

option go_package = "github.com/novitalabs/NovitaBox/internal/pb/novitabox/v1;novitaboxv1";

service BoxShim {
  rpc CreateRuntime(CreateRuntimeRequest) returns (RuntimeInfo);
  rpc PauseRuntime(PauseRuntimeRequest) returns (RuntimeInfo);
  rpc ResumeRuntime(ResumeRuntimeRequest) returns (RuntimeInfo);
  rpc KillRuntime(KillRuntimeRequest) returns (google.protobuf.Empty);
  rpc StartRuntime(StartRuntimeRequest) returns (RuntimeInfo);
  rpc StopRuntime(StopRuntimeRequest) returns (RuntimeInfo);
  rpc RebootRuntime(RebootRuntimeRequest) returns (RuntimeInfo);
  rpc Status(StatusRequest) returns (RuntimeInfo);
  rpc Capabilities(CapabilitiesRequest) returns (RuntimeCapabilities);
  rpc UpdateBalloon(UpdateBalloonRequest) returns (BalloonConfig);
  rpc GetBalloon(GetBalloonRequest) returns (BalloonConfig);
  rpc GetBalloonStats(GetBalloonStatsRequest) returns (BalloonStats);
  rpc UpdateBalloonStats(UpdateBalloonStatsRequest) returns (BalloonConfig);
  rpc StartBalloonHinting(StartBalloonHintingRequest) returns (BalloonHintingStatus);
  rpc StopBalloonHinting(StopBalloonHintingRequest) returns (BalloonHintingStatus);
  rpc GetBalloonHinting(GetBalloonHintingRequest) returns (BalloonHintingStatus);
}

message CreateRuntimeRequest {
  RuntimeSpec runtime_spec = 1;
}

message PauseRuntimeRequest {
  string sandbox_id = 1;
}

message ResumeRuntimeRequest {
  RuntimeSpec runtime_spec = 1;
}

message KillRuntimeRequest {
  string sandbox_id = 1;
}

message StartRuntimeRequest {
  RuntimeSpec runtime_spec = 1;
}

message StopRuntimeRequest {
  string sandbox_id = 1;
  uint32 timeout_seconds = 2;
}

message RebootRuntimeRequest {
  string sandbox_id = 1;
  uint32 timeout_seconds = 2;
}

message StatusRequest {
  string sandbox_id = 1;
}

message CapabilitiesRequest {
  RuntimeType runtime_type = 1;
}

message UpdateBalloonRequest {
  string sandbox_id = 1;
  uint32 amount_mib = 2;
}

message GetBalloonRequest {
  string sandbox_id = 1;
}

message GetBalloonStatsRequest {
  string sandbox_id = 1;
}

message UpdateBalloonStatsRequest {
  string sandbox_id = 1;
  uint32 stats_polling_interval_s = 2;
}

message StartBalloonHintingRequest {
  string sandbox_id = 1;
  reserved 2;
  reserved "interval_s";
  bool acknowledge_on_stop = 3;
}

message StopBalloonHintingRequest {
  string sandbox_id = 1;
}

message GetBalloonHintingRequest {
  string sandbox_id = 1;
}
